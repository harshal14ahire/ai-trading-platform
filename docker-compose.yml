version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: algo_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trading_pass}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trading}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trading_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: algo_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${POSTGRES_DB:-ai_trading}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-trading_user}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-trading_pass}
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
    depends_on:
      db:
        condition: service_healthy

  ai_orchestrator:
    build: ./ai_agents
    container_name: algo_orchestrator
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_BACKEND_URL=http://backend:8080/api/internal/execute
      - INITIAL_TRADING_CAPITAL=${INITIAL_TRADING_CAPITAL:-13000}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: algo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
