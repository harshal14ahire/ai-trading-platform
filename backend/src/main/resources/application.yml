spring:
  application:
    name: ai-trading-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ai_trading}
    username: ${DB_USER:trading_user}
    password: ${DB_PASSWORD:trading_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

kite:
  api:
    key: ${KITE_API_KEY}
    secret: ${KITE_API_SECRET}

server:
  port: 8080
