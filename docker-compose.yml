version: '3.8'

services:
  mongo:
    image: mongo:7.0
    container_name: algo_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: algo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    container_name: algo_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ai_trading
      - KITE_API_KEY=${KITE_API_KEY}
      - KITE_API_SECRET=${KITE_API_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

  ai_orchestrator:
    build: ./ai_agents
    container_name: algo_orchestrator
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JAVA_BACKEND_URL=http://backend:8080/api/internal/execute
      - INITIAL_TRADING_CAPITAL=${INITIAL_TRADING_CAPITAL:-13000}
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build: ./frontend
    container_name: algo_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  redis_data:
