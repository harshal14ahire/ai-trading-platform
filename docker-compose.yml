version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: aitrading_db
    restart: always
    environment:
      POSTGRES_USER: trading_user
      POSTGRES_PASSWORD: trading_password
      POSTGRES_DB: ai_trading
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aitrading_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  db_data:
